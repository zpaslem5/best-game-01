<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NOVA DRIFT — blast the rocks, gather the shards</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070b1a; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="NOVA DRIFT: fly the ship with WASD or arrow keys, aim with the mouse, hold click or Space to fire. Blast rocks, collect star shards, survive the waves."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
